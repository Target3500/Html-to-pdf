<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0b1120;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #151f32;
      border: 1px solid #223049;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 750px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 280px;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 12px;
      resize: vertical;
      direction: ltr;
      outline: none;
    }

    textarea:focus {
      border-color: #38bdf8;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    input[type="text"] {
      flex: 1;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      direction: ltr;
    }

    input[type="text"]:focus {
      border-color: #38bdf8;
    }

    button {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>تنزيل ملف HTML</h1>
    <p>الصق كود الـ HTML هنا واضغط زر التحميل لحفظه مباشرة على جهازك بصيغة .html</p>

    <textarea id="codeArea" placeholder="<!DOCTYPE html>&#10;<html>&#10;  ...&#10;</html>"></textarea>

    <div class="controls">
      <input type="text" id="fileName" value="index.html" placeholder="اسم الملف (مثال: my-page.html)">
      <button onclick="downloadHtml()">Download</button>
    </div>
  </div>

  <script>
    function downloadHtml() {
      const code = document.getElementById('codeArea').value;
      let filename = document.getElementById('fileName').value.trim();

      if (!code.trim()) {
        alert('من فضلك الصق كود HTML أولاً!');
        return;
      }

      if (!filename) {
        filename = 'index.html';
      } else if (!filename.endsWith('.html') && !filename.endsWith('.htm')) {
        filename += '.html';
      }

      const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }
  </script>

</body>
</html>
